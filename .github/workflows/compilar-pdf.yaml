name: compilar y subir PDFs

on:
  schedule:
    - cron: '0 6 * * *'  # todas las noches a las 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: revisar cambios recientes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git log --since="24 hours ago" --oneline -- \
            candidatura.tex capitulos secciones-formulario biblio.bib imagenes diapos \
            | wc -l)

          if [ "$CHANGED" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: compilar tesis
        if: steps.check.outputs.changed == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: candidatura.tex
          args: -pdf -interaction=nonstopmode -jobname=candidatura

      - name: compilar diapos
        if: steps.check.outputs.changed == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: diapos/diapos.tex
          work_in_root_file_dir: true
          args: -pdf -interaction=nonstopmode -jobname=diapos

      - name: preparar sitio
        if: steps.check.outputs.changed == 'true'
        run: |
          mkdir site
          cp candidatura.pdf site/candidatura.pdf
          cp diapos/diapos.pdf site/diapos.pdf

          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>montoyamoraga - candidatura tesis</title>
            <style>
              body { font-family: sans-serif; margin: 2rem; }
              a { display: block; margin-bottom: 0.5rem; }
            </style>
          </head>
          <body>
            <h1>montoyamoraga - candidatura tesis</h1>
            <a href="candidatura.pdf">tesis (PDF)</a>
            <a href="diapos.pdf">diapos (PDF)</a>
          </body>
          </html>
          EOF

      - name: upload artifact for Pages
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

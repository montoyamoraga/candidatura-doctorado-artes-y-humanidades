name: compilar y subir PDFs

on:
  push:
    branches: [main]
    paths:
      - 'candidatura.tex'
      - 'capitulos/**'
      - 'secciones-formulario/**'
      - 'biblio.bib'
      - 'imagenes/**'
      - 'diapos/**'
      - '.github/workflows/compilar-pdf.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: compilar tesis
        uses: xu-cheng/latex-action@v3
        with:
          root_file: candidatura.tex
          args: -pdf -interaction=nonstopmode -jobname=candidatura

      - name: compilar diapos
        uses: xu-cheng/latex-action@v3
        with:
          root_file: diapos/diapos.tex
          args: -pdf -interaction=nonstopmode -jobname=diapos

      - name: preparar sitio
        run: |
          mkdir site
          cp candidatura.pdf site/candidatura.pdf
          cp diapos/diapos.pdf site/diapos.pdf

          cat > site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>montoyamoraga - candidatura tesis</title>
            <style>
              body { font-family: sans-serif; margin: 0; }
              nav { padding: 0.5rem 1rem; background: #222; }
              nav button { margin-right: 0.5rem; padding: 0.4rem 0.8rem; }
              iframe { width: 100%; height: calc(100vh - 3rem); border: none; display: block; }
            </style>
          </head>
          <body>
            <nav>
              <button onclick="loadPDF('candidatura.pdf')">tesis</button>
              <button onclick="loadPDF('diapos.pdf')">diapos</button>
            </nav>
            <iframe id="viewer" src="candidatura.pdf"></iframe>

            <script>
              function loadPDF(file) {
                document.getElementById('viewer').src = file;
              }
            </script>
          </body>
          </html>
          EOF

      - name: upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
